shellEmulator: true

trustPolicy: no-downgrade

packages:
  - web
  - server
  - shared

overrides:
  # tsup / tsx 依赖链拉的 chokidar@4.0.3 无 provenance; 5.0.0 带证明 (同 ohday)
  chokidar: 5.0.0
  # babel 依赖链拉的 semver@6.3.1 无 provenance; 7.7.2 带证明, API 向后兼容
  semver: 7.7.2

  # @types/node 拉的 undici-types@6.21.0 无 provenance, 触发 no-downgrade;
  # 6.19.2 是最后一个带证明的 6.x, 仅是 fetch 类型定义, 锁到它兼容且安全
  undici-types: 6.19.2
# 允许运行构建脚本的依赖 (Prisma 需生成 client, esbuild 需装原生二进制)
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma

allowBuilds:
  "@prisma/client": set this to true or false
  "@prisma/engines": set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false
